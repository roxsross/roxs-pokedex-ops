# Servidor del frontend. Sirve los archivos estáticos y reenvía /api y /health
# a la API: el navegador habla con un solo origen, sin problemas de CORS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Resolver el nombre "api" en cada pedido (y no una
    # sola vez al arrancar) evita errores cuando el contenedor de la API se
    # recrea y cambia de IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:3000;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }

    location = /health {
        proxy_pass $api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
